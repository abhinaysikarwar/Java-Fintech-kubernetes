prometheus:
  prometheusSpec:
    retention: 15d

    nodeSelector:
      kubernetes.io/hostname: monitoring

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi


grafana:
  nodeSelector:
    kubernetes.io/hostname: monitoring

  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

  adminPassword: "StrongPassword123!"

  service:
    type: NodePort
    nodePort: 30090


alertmanager:

  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: monitoring

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi


  service:
    type: NodePort
    nodePort: 30093


  config:

    global:
      resolve_timeout: 5m


    route:
      receiver: discord-notifications

      group_by:
        - alertname

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h


      routes:

        # Ignore system noise alerts
        - receiver: null
          matchers:
            - alertname=~"Watchdog|Kube.*Unreachable|Alertmanager.*Failed.*|etcd.*"



    receivers:

      - name: null


      - name: discord-notifications

        discord_configs:

          - webhook_url: "https://discordapp.com/api/webhooks/1534046506607312926/7yA4MdWMwHTEWwOCuv0a5bWX81In7SCa2id_CRXMj4QsREALjwyb4FmfkKgOT3TT1cIW"

            send_resolved: true


            title: "🚨 Kubernetes Alert"


            message: |

              Status: {{ .Status }}

              {{ range .Alerts }}

              Alert Name:
              {{ .Labels.alertname }}


              Severity:
              {{ .Labels.severity }}


              Namespace:
              {{ .Labels.namespace }}


              Pod:
              {{ .Labels.pod }}


              Container:
              {{ .Labels.container }}


              Description:

              {{ .Annotations.description }}


              ======================

              {{ end }}



additionalPrometheusRulesMap:

  custom-crashloop-rule:

    groups:

      - name: custom-kubernetes-apps


        rules:


          - alert: KubePodCrashLoopingFast

            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1

            for: 30s

            labels:

              severity: warning


            annotations:

              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff"



          - alert: KubePodOOMKilled

            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1

            for: 10s

            labels:

              severity: critical


            annotations:

              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled"